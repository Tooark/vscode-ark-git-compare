name: ✨ Feature request
description: Suggest a new feature or improvement for the Ark Git Compare extension.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Please explain the **problem** you are trying to solve, not just the solution.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I have searched existing issues and discussions.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Sidebar (branch/commit selection)
        - Diff view (side-by-side comparison)
        - Commands / command palette
        - Localization
        - Other / cross-cutting
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this.
        - label: I would be willing to help test this.
